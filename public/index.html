<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ex Cartiera — Live Vote</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .hero {
        min-height: calc(100vh - 2rem);
        display: grid;
        align-items: center;
        gap: 1.5rem;
      }
      .hero-grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 1.5rem;
        align-items: stretch;
      }
      .hero-copy {
        padding: 2rem;
      }
      .hero-copy h1 {
        font-family: var(--font-display);
        font-size: clamp(2.8rem, 8vw, 5.2rem);
        margin: 0.35rem 0 0.8rem;
        letter-spacing: -0.05em;
        line-height: 0.92;
      }
      .hero-copy p {
        font-size: 1.1rem;
        max-width: 36ch;
        margin: 0 0 1.4rem;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem;
      }
      .qr-panel {
        padding: 1.4rem;
        display: grid;
        place-items: center;
        text-align: center;
        background:
          linear-gradient(160deg, rgba(31, 74, 60, 0.95), rgba(15, 42, 34, 0.98));
        color: #eef5f0;
      }
      .qr-panel img {
        width: min(280px, 70vw);
        height: auto;
        border-radius: 16px;
        background: #fff;
        padding: 0.8rem;
        animation: rise-in 0.7s ease both;
      }
      .links {
        margin-top: 1.2rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
      }
      .links a {
        text-decoration: none;
      }
      @media (max-width: 860px) {
        .hero-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell hero">
      <div class="hero-grid">
        <section class="panel hero-copy rise">
          <div class="eyebrow">University lecture · live scoring</div>
          <h1 class="brand">Ex Cartiera</h1>
          <p class="muted">
            Score four presentations across four criteria. Join from your phone,
            watch votes arrive live on the room screens.
          </p>
          <div class="actions">
            <a class="btn lime" href="/vote.html">Vote now</a>
            <a class="btn secondary" href="/display.html">Live screen</a>
          </div>
          <div class="links">
            <a class="pill" href="/criteria.html">Criteria screen</a>
            <a class="pill" href="/admin.html">Admin</a>
          </div>
        </section>
        <section class="panel qr-panel rise" style="animation-delay: 0.08s">
          <div class="eyebrow" style="color: var(--lime)">Scan to vote</div>
          <h2 style="font-family: var(--font-display); margin: 0.4rem 0 1rem">
            Student · Teacher · Staff
          </h2>
          <img id="qr" alt="QR code linking to the voting page" />
          <p class="muted" style="color: #c9d8d0; margin: 1rem 0 0; font-size: 0.9rem">
            Quotas: 8 students · 4 teachers · 4 staff
          </p>
        </section>
      </div>
    </main>
    <script type="module">
      document.getElementById("qr").src = `/api/qr?t=${Date.now()}`;
    </script>
  </body>
</html>
